<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEDDMX Bluetooth Controller</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #121212;
      color: #f5f5f5;
      max-width: 480px;
      margin: 1.5rem auto;
      padding: 1.25rem;
      border-radius: 12px;
      border: 1px solid #2c2c2c;
    }
    h2 { margin-top: 0; }
    .card {
      background: #1e1e1e;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 0.65rem 1.1rem;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      margin-right: 0.5rem;
    }
    button:disabled { background: #444; cursor: not-allowed; }
    button.danger { background: #dc3545; }
    button.success { background: #28a745; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0.75rem 0;
    }
    input[type="color"] {
      width: 60px;
      height: 36px;
      border: none;
      background: none;
      cursor: pointer;
    }
    input[type="text"] {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 0.5rem;
      border-radius: 4px;
      width: 65%;
      font-family: monospace;
    }
    input[type="range"] { width: 60%; }
    #log {
      background: #000;
      color: #0f0;
      font-family: monospace;
      font-size: 0.8rem;
      height: 150px;
      overflow-y: auto;
      padding: 0.75rem;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <h2>LEDDMX BLE Controller</h2>

  <div class="card">
    <button id="connectBtn">Scan & Connect</button>
    <button id="disconnectBtn" class="danger" disabled>Disconnect</button>
    <p id="status" style="margin-bottom: 0; margin-top: 0.75rem; font-size: 0.9rem; color: #aaa;">Status: Disconnected</p>
  </div>

  <div class="card">
    <div class="row">
      <span>Power</span>
      <div>
        <button id="onBtn" class="success" disabled>ON</button>
        <button id="offBtn" class="danger" disabled>OFF</button>
      </div>
    </div>

    <div class="row">
      <label for="colorPicker">RGB Color</label>
      <input type="color" id="colorPicker" value="#ff0055" disabled>
    </div>

    <div class="row">
      <label for="brightnessSlider">Brightness (<span id="brightVal">100</span>%)</label>
      <input type="range" id="brightnessSlider" min="0" max="100" value="100" disabled>
    </div>
  </div>

  <div class="card">
    <label style="display:block; margin-bottom:0.5rem; font-size:0.85rem;">Raw Hex Payload</label>
    <div class="row" style="margin:0;">
      <input type="text" id="rawHexInput" placeholder="e.g. 7e 00 05 03 ff 00 00 00 ef" disabled>
      <button id="sendRawBtn" disabled>Send</button>
    </div>
  </div>

  <div id="log">Ready. Disconnect other BLE apps first, then tap "Scan & Connect"...<br></div>

  <script>
    const SERVICE_UUID = 0xFFE0;
    const CHAR_UUID = 0xFFE1;

    let bleDevice = null;
    let writeCharacteristic = null;

    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const controls = [
      document.getElementById('onBtn'),
      document.getElementById('offBtn'),
      document.getElementById('colorPicker'),
      document.getElementById('brightnessSlider'),
      document.getElementById('rawHexInput'),
      document.getElementById('sendRawBtn')
    ];

    function log(msg) {
      logEl.innerHTML += `> ${msg}<br>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setControlsEnabled(enabled) {
      controls.forEach(el => el.disabled = !enabled);
      disconnectBtn.disabled = !enabled;
      connectBtn.disabled = enabled;
    }

    connectBtn.addEventListener('click', async () => {
      if (!navigator.bluetooth) {
        log('Error: Web Bluetooth is not supported in this browser.');
        return;
      }

      try {
        log('Opening BLE device picker...');
        bleDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        log(`Connecting to ${bleDevice.name || bleDevice.id}...`);
        const server = await bleDevice.gatt.connect();

        log('Discovering Service 0xFFE0...');
        const service = await server.getPrimaryService(SERVICE_UUID);

        log('Discovering Characteristic 0xFFE1...');
        writeCharacteristic = await service.getCharacteristic(CHAR_UUID);

        if (writeCharacteristic.properties.notify) {
          await writeCharacteristic.startNotifications();
          writeCharacteristic.addEventListener('characteristicvaluechanged', (event) => {
            const val = new Uint8Array(event.target.value.buffer);
            const hex = Array.from(val).map(b => b.toString(16).padStart(2, '0')).join(' ');
            log(`RX: ${hex}`);
          });
        }

        statusEl.textContent = `Status: Connected to ${bleDevice.name || 'LEDDMX'}`;
        statusEl.style.color = '#28a745';
        setControlsEnabled(true);
        log('Connected and ready!');
      } catch (err) {
        const msg = err?.message || (typeof err === 'object' ? JSON.stringify(err) : String(err));
        log(`Error: ${msg} (If code 2: picker cancelled or device still connected in another app)`);
      }
    });

    disconnectBtn.addEventListener('click', () => {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      }
    });

    function onDisconnected() {
      statusEl.textContent = 'Status: Disconnected';
      statusEl.style.color = '#aaa';
      setControlsEnabled(false);
      writeCharacteristic = null;
      log('Device disconnected.');
    }

    async function sendBytes(byteArray) {
      if (!writeCharacteristic) return;
      const buffer = new Uint8Array(byteArray);
      const hexStr = Array.from(buffer).map(b => b.toString(16).padStart(2, '0')).join(' ');
      try {
        if (writeCharacteristic.properties.writeWithoutResponse) {
          await writeCharacteristic.writeValueWithoutResponse(buffer);
        } else {
          await writeCharacteristic.writeValue(buffer);
        }
        log(`TX: ${hexStr}`);
      } catch (err) {
        log(`Write failed: ${err?.message || err}`);
      }
    }

    document.getElementById('onBtn').addEventListener('click', () => {
      sendBytes([0x7e, 0x00, 0x04, 0xf0, 0x00, 0x01, 0xff, 0x00, 0xef]);
    });

    document.getElementById('offBtn').addEventListener('click', () => {
      sendBytes([0x7e, 0x00, 0x04, 0x00, 0x00, 0x00, 0xff, 0x00, 0xef]);
    });

    let colorTimeout = null;
    document.getElementById('colorPicker').addEventListener('input', (e) => {
      clearTimeout(colorTimeout);
      colorTimeout = setTimeout(() => {
        const hex = e.target.value;
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        sendBytes([0x7e, 0x00, 0x05, 0x03, r, g, b, 0x00, 0xef]);
      }, 60);
    });

    let brightTimeout = null;
    document.getElementById('brightnessSlider').addEventListener('input', (e) => {
      const val = parseInt(e.target.value, 10);
      document.getElementById('brightVal').textContent = val;
      clearTimeout(brightTimeout);
      brightTimeout = setTimeout(() => {
        sendBytes([0x7e, 0x00, 0x01, val, 0x00, 0x00, 0x00, 0x00, 0xef]);
      }, 60);
    });

    document.getElementById('sendRawBtn').addEventListener('click', () => {
      const raw = document.getElementById('rawHexInput').value.trim();
      if (!raw) return;
      const bytes = raw.split(/[\s,]+/).map(h => parseInt(h, 16)).filter(n => !isNaN(n));
      sendBytes(bytes);
    });
  </script>
</body>
</html>
